server:
  port: 8080 # 🌟 ĐIỂM SỬA QUAN TRỌNG: Đổi từ 8081 về 8080 để khớp với ReactJS
spring:
  application:
    name: BlockChain_Backed

  datasource:
    url: jdbc:postgresql://localhost:5432/mini_banking_blockchain
    username: postgres
    password: 12345
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update # Tự động tạo/cập nhật bảng từ code Java
    show-sql: true # Hiển thị câu lệnh SQL trên console
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true